#
# application settings
#
app.order.delivery-time-in-minutes=12
app.delivery-time.base-url=http://localhost:8081
app.order.discount-days=MONDAY, TUESDAY
app.order.discount-rate=6.5
app.order.greeting=Welcome dear customer!
app.data-loader=sample
app.data-loader.csv.product-data=classpath:products.csv

#
# web settings
#
# exercise b): Spring MVC errors as ProblemDetail (RFC 9457); has no effect as soon as there is a custom
# ResponseEntityExceptionHandler such as pizza.web.ApiExceptionHandler
spring.mvc.problemdetails.enabled=true

#
# http client settings
#
# exercise b): without a timeout an order waits as long as the delivery time service takes
spring.http.clients.read-timeout=2s
# bonus c): base URL of the HTTP service group "delivery-time" (@ImportHttpServices on PizzaApp)
spring.http.serviceclient.delivery-time.base-url=${app.delivery-time.base-url}

#
# jpa settings
#
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
