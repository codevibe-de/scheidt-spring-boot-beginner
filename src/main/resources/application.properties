#
# application settings
#
app.order.delivery-time-in-minutes=12
app.delivery.base-url=http://localhost:8081
app.order.discount-days=MONDAY, TUESDAY
app.order.discount-rate=6.5
app.order.greeting=Welcome dear customer!
app.data-loader=sample
app.data-loader.csv.product-data=classpath:products.csv

#
# web settings
#
# Übung b): Spring-MVC-Fehler als ProblemDetail (RFC 9457); wirkungslos, sobald es einen eigenen
# ResponseEntityExceptionHandler gibt wie pizza.web.ApiExceptionHandler
spring.mvc.problemdetails.enabled=true

#
# http client settings
#
# Übung b): ohne Timeout wartet eine Bestellung, solange der Lieferdienst braucht
spring.http.clients.read-timeout=2s
# Bonus c): Basis-URL der HTTP-Service-Gruppe "delivery" (@ImportHttpServices an PizzaApp)
spring.http.serviceclient.delivery.base-url=${app.delivery.base-url}

#
# jpa settings
#
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
