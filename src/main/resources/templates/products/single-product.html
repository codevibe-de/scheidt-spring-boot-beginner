<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring Pizza — Product</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link th:href="@{/bootstrap-5.3.3.css}" rel="stylesheet"/>
</head>
<body class="p-5">
<div class="container bg-light rounded-2 text-start px-4 py-2">
    <div class="row">
        <div class="col">
            <h1 th:text="'Product ' + ${product.getId()}">Product …</h1>
            <p>
                Name: <span th:text="${product.getName()}">…</span>
                <br>
                Price: <span th:text="${#numbers.formatCurrency(product.getPrice())}">…</span>
            </p>
        </div>
    </div>
</div>
</body>
</html>
