#
# running against the H2 server from start-h2-server.sh (data is kept in h2-data/)
#
spring.datasource.url=jdbc:h2:tcp://localhost:9092/./pizzadb
spring.datasource.username=sa
spring.datasource.password=

# the sample data comes from db/sample-data (bonus d); the DataLoader "sample" would
# fail on the second start because of the products and customers already present.
app.data-loader=none
spring.flyway.locations=classpath:db/migration,classpath:db/sample-data
