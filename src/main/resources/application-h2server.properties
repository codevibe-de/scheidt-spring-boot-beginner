#
# Betrieb gegen den H2-Server aus start-h2-server.sh (Daten bleiben unter h2-data/ erhalten)
#
spring.datasource.url=jdbc:h2:tcp://localhost:9092/./pizzadb
spring.datasource.username=sa
spring.datasource.password=

# Die Beispieldaten kommen aus db/sample-data (Bonus d); der DataLoader "sample" würde
# beim zweiten Start an den schon vorhandenen Produkten und Kunden scheitern.
app.data-loader=none
spring.flyway.locations=classpath:db/migration,classpath:db/sample-data
